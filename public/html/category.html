<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Categories</title>
  
  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Page-Specific Styles -->
  <link rel="stylesheet" href="/css/category.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>🛍️ <span id="shopNameHeader">Our Business</span></h1>
  <div class="header-right">
    <a href="/">Home</a>
    <a href="/account.html">Account</a>
    <a href="/cart.html" style="position:relative;">
      <i class="fas fa-shopping-cart" style="font-size:1.2rem;"></i>
      <span id="cartBadge" style="position:absolute; top:-6px; right:-8px; background:#ef4444; color:white; border-radius:50%; padding:0 5px; font-size:0.55rem; min-width:16px; text-align:center; font-weight:700; display:none;">0</span>
    </a>
  </div>
</div>

<!-- ===== CATEGORY PAGE ===== -->
<div class="category-page">
  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Shop</a>
  <h1>📂 Categories</h1>
  <p class="sub">Browse products by category</p>

  <!-- Category Grid -->
  <div class="category-grid" id="categoryGrid">
    <p class="no-categories-msg" style="grid-column:1/-1; color:#94a3b8; text-align:center; padding:20px;">Loading categories...</p>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search products..." onkeyup="window.handleSearch()">
      <button class="search-btn" id="searchBtn" onclick="window.handleSearchWithFeedback()">
        <i class="fas fa-search"></i> Search
      </button>
    </div>
    <select id="categoryFilter" onchange="window.handleSearch()">
      <option value="all">All Categories</option>
    </select>
  </div>

  <h2 style="font-size:1rem; font-weight:700; margin:12px 0 6px;">Products</h2>
  <div id="productsContainer">
    <div class="product-grid" id="productGrid">
      <p style="text-align:center;padding:40px;color:#94a3b8;">Loading products...</p>
    </div>
  </div>
</div>

<!-- ===== BOTTOM NAV - FIXED ===== -->
<div class="bottom-nav">
  <a href="/"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/category.html" class="active"><i class="fas fa-th-large"></i><span>Category</span></a>
  <a href="/account.html"><i class="fas fa-envelope"></i><span>Messages</span></a>
  <a href="/cart.html" style="position:relative;">
    <i class="fas fa-shopping-cart"></i>
    <span class="nav-badge" id="navCartBadge">0</span>
    <span>Cart</span>
  </a>
  <a href="/account.html"><i class="fas fa-user"></i><span>Account</span></a>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/category.js"></script>
</body>
</html>
