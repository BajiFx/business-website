<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Reset Password</title>
  
  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Page-Specific Styles -->
  <link rel="stylesheet" href="/css/reset-password.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="reset-header">
  <h1><i class="fas fa-store"></i> <span id="shopNameHeader">Our Business</span></h1>
  <a href="/"><i class="fas fa-home"></i> Home</a>
</div>

<!-- ===== RESET PAGE ===== -->
<div class="reset-page">
  <div class="reset-card">
    <h1>🔑 Reset Password</h1>
    <p class="sub" id="pageSub">Enter your email to receive a reset link.</p>

    <div id="step1">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="your@email.com">
      </div>
      <button class="btn" onclick="requestReset()">Send Reset Link</button>
    </div>

    <div id="step2" style="display:none;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password">
      </div>
      <button class="btn btn-success" onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="status" class="status"></div>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Shop</a>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/js/reset-password.js"></script>
</body>
</html>
