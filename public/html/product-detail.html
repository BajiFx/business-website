<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Product Detail</title>
  
  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="/css/product-detail.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>🛍️ <span id="shopNameHeader">Our Business</span></h1>
  <div class="header-right">
    <a href="/">Home</a>
    <a href="/cart.html" style="position:relative;">
      <i class="fas fa-shopping-cart" style="font-size:1.2rem;"></i>
      <span id="cartBadge" style="position:absolute; top:-6px; right:-8px; background:#ef4444; color:white; border-radius:50%; padding:0 5px; font-size:0.55rem; min-width:16px; text-align:center; font-weight:700; display:none;">0</span>

</div>

<div class="product-detail-page" id="productDetail">

  <div id="detailContent"><p style="text-align:center; padding:40px;">Loading...</p></div>
</div>

<!-- ===== BOTTOM NAV - FIXED ===== -->
<div class="bottom-nav">
  <a href="/"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/category.html"><i class="fas fa-th-large"></i><span>Category</span></a>

  <a href="#" onclick="openChatTab(); return false;"><i class="fas fa-envelope"></i><span>Messages</span></a>
  <a href="/cart.html" style="position:relative;">
    <i class="fas fa-shopping-cart"></i>
    <span class="nav-badge" id="navCartBadge">0</span>
    <span>Cart</span>

  <a href="/account.html"><i class="fas fa-user"></i><span>Account</span></a>

<script src="/js/app.js"></script>
