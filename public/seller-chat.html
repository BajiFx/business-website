<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background:#f4f6f9; height:100vh; display:flex; flex-direction:column; }
    .header { background:#1e293b; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
    .header a { color:#94a3b8; text-decoration:none; margin:0 10px; }
    .header a:hover { color:white; }
    #chatContainer { max-width:800px; margin:20px auto; flex:1; display:flex; flex-direction:column; background:white; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); overflow:hidden; width:100%; }
    #messages { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; background:#f8fafc; }
    .msg { padding:10px 16px; border-radius:18px; max-width:80%; }
    .msg.customer { background:#2563eb; color:white; align-self:flex-end; }
    .msg.seller { background:#e2e8f0; color:#1e293b; align-self:flex-start; }
    .msg .meta { font-size:0.7rem; opacity:0.7; margin-bottom:2px; }
    #inputArea { display:flex; padding:16px; border-top:1px solid #e2e8f0; background:white; }
    #inputArea input { flex:1; padding:10px 16px; border:1px solid #d1d5db; border-radius:30px; outline:none; }
    #inputArea button { margin-left:10px; padding:10px 24px; background:#2563eb; color:white; border:none; border-radius:30px; cursor:pointer; font-weight:bold; }
    #inputArea button:hover { background:#1d4ed8; }
    .empty { color:#94a3b8; text-align:center; padding:40px; }
  </style>
</head>
<body>
<div class="header">
  <h1>💬 Seller Live Chat</h1>
  <div>
    <a href="/admin.html">← Admin Panel</a>
    <a href="/">Public Shop</a>
  </div>
</div>
<div id="chatContainer">
  <div id="messages"><p class="empty">Loading messages...</p></div>
  <div id="inputArea">
    <input id="msgInput" type="text" placeholder="Type your reply..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let socket = io();
  let messages = [];

  socket.on('connect', () => {
    console.log('Seller chat connected');
    socket.emit('request-chat-history');
  });
  socket.on('chat-history', (msgs) => {
    messages = msgs;
    renderMessages();
  });
  socket.on('new-chat-message', (msg) => {
    messages.push(msg);
    renderMessages();
  });

  function renderMessages() {
    const container = document.getElementById('messages');
    if (!messages.length) {
      container.innerHTML = '<p class="empty">No messages yet. Customers will appear here.</p>';
      return;
    }
    container.innerHTML = messages.map(msg => `
      <div class="msg ${msg.from === 'Customer' ? 'customer' : 'seller'}">
        <div class="meta">${msg.from} · ${msg.timestamp}</div>
        <div>${msg.message}</div>
      </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('chat-message', { from: 'Seller', message: text });
    input.value = '';
  }
</script>
</body>
</html>
