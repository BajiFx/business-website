<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }

    .admin-header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .admin-header a { color: #94a3b8; text-decoration: none; margin: 0 10px; }
    .admin-header a:hover { color: white; }

    .auth-container { max-width: 420px; margin: 40px auto; background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); overflow: hidden; }
    .auth-tabs { display: flex; border-bottom: 1px solid #e2e8f0; }
    .auth-tabs button { flex: 1; padding: 14px; border: none; background: #f8fafc; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .auth-tabs button.active { background: white; color: #2563eb; border-bottom: 3px solid #2563eb; }
    .auth-tabs button:hover { background: #e2e8f0; }

    .auth-form { padding: 30px; display: none; }
    .auth-form.active { display: block; }
    .auth-form h2 { margin-top: 0; margin-bottom: 6px; color: #0f172a; }
    .auth-form p.sub { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; position: relative; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; color: #334155; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; transition: 0.2s; }
    .form-group input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .form-group .toggle-pwd { position: absolute; right: 12px; bottom: 12px; cursor: pointer; color: #94a3b8; background: none; border: none; font-size: 1.1rem; }
    .form-group .toggle-pwd:hover { color: #334155; }

    .btn-primary { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-status { text-align: center; font-size: 0.9rem; margin-top: 12px; padding: 8px; border-radius: 8px; }
    .auth-status.error { color: #ef4444; background: #fef2f2; }
    .auth-status.success { color: #16a34a; background: #f0fdf4; }

    .hidden { display: none !important; }

    /* Dashboard styles */
    .dashboard-container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
    .dashboard-section { background: white; padding: 25px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .dashboard-section h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-row .full { grid-column: 1 / -1; }
    .dashboard-section input, .dashboard-section textarea, .dashboard-section select { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #d1d5db; border-radius: 8px; }
    .dashboard-section label { font-weight: 600; font-size: 0.9rem; color: #334155; }
    .checkbox-group { display: flex; gap: 20px; margin: 10px 0; }
    .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding: 12px 0; flex-wrap: wrap; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
    .badge-preview { background: #e2e8f0; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-right: 4px; }
    .gps-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .gps-btn:hover { background: #1d4ed8; }
    #adminMapPreview { height: 200px; border-radius: 12px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; }
    .logout-btn:hover { background: #dc2626; }
    .btn-success { background: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-success:hover { background: #16a34a; }
  </style>
</head>
<body>

<div class="admin-header">
  <h1>🔐 Admin Panel</h1>
  <div>
    <a href="/">← Back to Shop</a>
    <button id="logoutBtn" class="logout-btn hidden" onclick="logout()">Logout</button>
  </div>
</div>

<!-- ============ AUTH SECTION ============ -->
<div id="authContainer" class="auth-container">
  <div class="auth-tabs">
    <button id="loginTab" class="active" onclick="showTab('login')">Login</button>
    <button id="registerTab" onclick="showTab('register')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm" class="auth-form active">
    <h2>Welcome Back</h2>
    <p class="sub">Login to manage your business.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
      <button class="toggle-pwd" onclick="togglePassword('loginPassword', this)"><i class="fas fa-eye"></i></button>
    </div>
    <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Login</button>
    <div id="loginStatus" class="auth-status"></div>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" class="auth-form">
    <h2>Create Admin Account</h2>
    <p class="sub">This can only be done once. After registration, new accounts are blocked.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min 6 characters">
      <button class="toggle-pwd" onclick="togglePassword('regPassword', this)"><i class="fas fa-eye"></i></button>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="Re-enter your password">
      <button class="toggle-pwd" onclick="togglePassword('regConfirm', this)"><i class="fas fa-eye"></i></button>
    </div>
    <button class="btn-primary" id="registerBtn" onclick="handleRegister()">Create Account</button>
    <div id="registerStatus" class="auth-status"></div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboardContainer" class="hidden dashboard-container">

  <!-- SHOP PROFILE -->
  <div class="dashboard-section">
    <h2>🏪 Shop Profile</h2>
    <form id="shopForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="full"><label>Shop Name</label><input type="text" id="shopName" name="name" placeholder="My Shop"></div>
        <div class="full"><label>Location</label><input type="text" id="shopLocation" name="location" placeholder="Nairobi, Kenya"></div>
        <div class="full"><label>Address</label><input type="text" id="shopAddress" name="address" placeholder="Street, Building"></div>
        <div class="full">
          <label>GPS Coordinates</label>
          <button type="button" class="gps-btn" id="getLocationBtn">📍 Get Current Location</button>
          <span id="locationStatus" style="font-size:0.9rem; color:#16a34a;"></span>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <input type="text" id="shopLatitude" name="latitude" placeholder="Latitude" readonly style="background:#f1f5f9;">
            <input type="text" id="shopLongitude" name="longitude" placeholder="Longitude" readonly style="background:#f1f5f9;">
          </div>
          <div id="adminMapPreview"></div>
        </div>
        <div><label><i class="fab fa-whatsapp"></i> WhatsApp</label><input type="text" id="shopWhatsapp" name="whatsapp" placeholder="254712345678"></div>
        <div><label><i class="fab fa-tiktok"></i> TikTok</label><input type="text" id="shopTiktok" name="tiktok" placeholder="@myshop"></div>
        <div><label><i class="fab fa-instagram"></i> Instagram</label><input type="text" id="shopInstagram" name="instagram" placeholder="@myshop"></div>
        <div><label><i class="fab fa-facebook"></i> Facebook</label><input type="text" id="shopFacebook" name="facebook" placeholder="username"></div>
        <div><label><i class="fas fa-phone"></i> Phone</label><input type="text" id="shopPhone" name="phone" placeholder="+254700000000"></div>
        <div class="full"><label>Description</label><textarea id="shopDesc" name="description" rows="2"></textarea></div>
        <div><label>Mission</label><textarea id="shopMission" name="mission" rows="2"></textarea></div>
        <div><label>Vision</label><textarea id="shopVision" name="vision" rows="2"></textarea></div>
        <div><label>Logo</label><input type="file" id="shopLogo" name="logo" accept="image/*"></div>
        <div><label>Hero Image</label><input type="file" id="shopHero" name="heroImage" accept="image/*"></div>
      </div>
      <button type="submit" class="btn-success">💾 Update Shop Profile</button>
    </form>
  </div>

  <!-- ADD PRODUCT -->
  <div class="dashboard-section">
    <h2>➕ Add Product</h2>
    <form id="productForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="full"><label>Product Name</label><input type="text" id="pName" name="name" required></div>
        <div><label>Price</label><input type="text" id="pPrice" name="price" required></div>
        <div><label>Rating</label><input type="text" id="pRating" name="rating" placeholder="e.g. 6235"></div>
        <div class="full"><label>Contact</label><input type="text" id="pContact" name="contact" value="+254700000000"></div>
        <div><label>Badge 1</label><input type="text" id="pBadge1" name="badge1" placeholder="Brand Official"></div>
        <div><label>Badge 2</label><input type="text" id="pBadge2" name="badge2" placeholder="Fulfilled By Kilimall"></div>
        <div class="full"><label>Shipping</label><input type="text" id="pShipping" name="shipping" placeholder="1-3Day Fast Delivery"></div>
        <div class="full checkbox-group">
          <label><input type="checkbox" id="pFlashSale" name="isFlashSale"> 🔥 Flash Sale</label>
          <label><input type="checkbox" id="pNewArrival" name="isNewArrival"> 🆕 New Arrival</label>
        </div>
        <div><label>Image</label><input type="file" id="pImage" name="image" accept="image/*"></div>
        <div><label>Video</label><input type="file" id="pVideo" name="video" accept="video/*"></div>
      </div>
      <button type="submit" class="btn-success">➕ Add Product</button>
    </form>
  </div>

  <!-- MANAGE PRODUCTS -->
  <div class="dashboard-section">
    <h2>📋 Manage Products</h2>
    <div id="adminProductList"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let token = localStorage.getItem('token');
let adminMap = null;

// ============ TAB SWITCHING ============
function showTab(tab) {
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
}

// ============ TOGGLE PASSWORD ============
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

// ============ CHECK IF ADMIN EXISTS ============
async function checkAdminExists() {
  try {
    const res = await fetch('/api/auth/admin-exists');
    const data = await res.json();
    if (data.exists) {
      document.getElementById('registerTab').style.display = 'none';
      document.getElementById('registerForm').classList.remove('active');
      document.getElementById('loginForm').classList.add('active');
      document.getElementById('loginTab').classList.add('active');
    } else {
      document.getElementById('registerTab').style.display = 'block';
    }
  } catch (err) {
    console.error('Error checking admin:', err);
  }
}

// ============ REGISTER ============
async function handleRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;
  const status = document.getElementById('registerStatus');

  status.className = 'auth-status';
  status.textContent = '';

  if (!email || !password || !confirm) {
    status.textContent = '❌ All fields are required.';
    status.className = 'auth-status error';
    return;
  }
  if (password.length < 6) {
    status.textContent = '❌ Password must be at least 6 characters.';
    status.className = 'auth-status error';
    return;
  }
  if (password !== confirm) {
    status.textContent = '❌ Passwords do not match.';
    status.className = 'auth-status error';
    return;
  }

  status.textContent = '⏳ Creating account...';
  status.className = 'auth-status';
  document.getElementById('registerBtn').disabled = true;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      status.textContent = '✅ ' + data.message;
      status.className = 'auth-status success';
      localStorage.setItem('token', data.token);
      token = data.token;
      setTimeout(() => {
        showDashboard();
      }, 500);
    } else {
      status.textContent = '❌ ' + data.error;
      status.className = 'auth-status error';
      document.getElementById('registerBtn').disabled = false;
    }
  } catch (err) {
    status.textContent = '❌ Network error. Please try again.';
    status.className = 'auth-status error';
    document.getElementById('registerBtn').disabled = false;
  }
}

// ============ LOGIN ============
async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const status = document.getElementById('loginStatus');

  status.className = 'auth-status';
  status.textContent = '';

  if (!email || !password) {
    status.textContent = '❌ Email and password are required.';
    status.className = 'auth-status error';
    return;
  }

  status.textContent = '⏳ Logging in...';
  status.className = 'auth-status';
  document.getElementById('loginBtn').disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      status.textContent = '✅ Welcome back!';
      status.className = 'auth-status success';
      localStorage.setItem('token', data.token);
      token = data.token;
      setTimeout(() => {
        showDashboard();
      }, 500);
    } else {
      status.textContent = '❌ ' + data.error;
      status.className = 'auth-status error';
      document.getElementById('loginBtn').disabled = false;
    }
  } catch (err) {
    status.textContent = '❌ Network error. Please try again.';
    status.className = 'auth-status error';
    document.getElementById('loginBtn').disabled = false;
  }
}

// ============ LOGOUT ============
function logout() {
  localStorage.removeItem('token');
  token = null;
  document.getElementById('authContainer').style.display = 'block';
  document.getElementById('dashboardContainer').classList.add('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('registerBtn').disabled = false;
}

// ============ SHOW DASHBOARD ============
function showDashboard() {
  document.getElementById('authContainer').style.display = 'none';
  document.getElementById('dashboardContainer').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  loadShopProfile();
  loadAdminProducts();
}

// ============ SHOP PROFILE ============
async function loadShopProfile() {
  const res = await fetch('/api/shop', {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (res.status === 401) { logout(); return; }
  const shop = await res.json();
  document.getElementById('shopName').value = shop.name || '';
  document.getElementById('shopLocation').value = shop.location || '';
  document.getElementById('shopAddress').value = shop.address || '';
  document.getElementById('shopLatitude').value = shop.latitude || '';
  document.getElementById('shopLongitude').value = shop.longitude || '';
  document.getElementById('shopWhatsapp').value = shop.whatsapp || '';
  document.getElementById('shopTiktok').value = shop.tiktok || '';
  document.getElementById('shopInstagram').value = shop.instagram || '';
  document.getElementById('shopFacebook').value = shop.facebook || '';
  document.getElementById('shopPhone').value = shop.phone || '';
  document.getElementById('shopDesc').value = shop.description || '';
  document.getElementById('shopMission').value = shop.mission || '';
  document.getElementById('shopVision').value = shop.vision || '';
  updateAdminMap(shop.latitude, shop.longitude);
}

function updateAdminMap(lat, lng) {
  const mapContainer = document.getElementById('adminMapPreview');
  const latNum = parseFloat(lat);
  const lngNum = parseFloat(lng);
  if (latNum && lngNum && !isNaN(latNum) && !isNaN(lngNum)) {
    if (adminMap) adminMap.remove();
    adminMap = L.map('adminMapPreview').setView([latNum, lngNum], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(adminMap);
    L.marker([latNum, lngNum]).addTo(adminMap);
  } else {
    mapContainer.innerHTML = '<p style="padding:10px;color:#94a3b8;text-align:center;">No location set.</p>';
    if (adminMap) { adminMap.remove(); adminMap = null; }
  }
}

document.getElementById('getLocationBtn').addEventListener('click', function() {
  if (!navigator.geolocation) {
    document.getElementById('locationStatus').textContent = '❌ Not supported';
    return;
  }
  const btn = this;
  btn.disabled = true;
  document.getElementById('locationStatus').textContent = '⏳ Getting location...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      document.getElementById('shopLatitude').value = lat;
      document.getElementById('shopLongitude').value = lng;
      document.getElementById('locationStatus').textContent = '✅ Location detected!';
      updateAdminMap(lat, lng);
      btn.disabled = false;
    },
    (err) => {
      document.getElementById('locationStatus').textContent = '❌ ' + err.message;
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
});

document.getElementById('shopForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const logo = document.getElementById('shopLogo').files[0];
  const hero = document.getElementById('shopHero').files[0];
  if (logo) formData.append('logo', logo);
  if (hero) formData.append('heroImage', hero);
  try {
    const res = await fetch('/api/shop', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData
    });
    const data = await res.json();
    if (res.ok) {
      alert('✅ Shop Profile Updated!');
      loadShopProfile();
    } else {
      alert('❌ Update failed: ' + (data.error || 'Unknown error'));
    }
  } catch (err) {
    alert('❌ Network error: ' + err.message);
  }
});

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const flashSale = document.getElementById('pFlashSale').checked;
  const newArrival = document.getElementById('pNewArrival').checked;
  formData.set('isFlashSale', flashSale ? 'true' : 'false');
  formData.set('isNewArrival', newArrival ? 'true' : 'false');
  const image = document.getElementById('pImage').files[0];
  const video = document.getElementById('pVideo').files[0];
  if (image) formData.append('image', image);
  if (video) formData.append('video', video);
  try {
    const res = await fetch('/api/products', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData
    });
    const data = await res.json();
    if (res.ok) {
      alert('✅ Product added!');
      document.getElementById('productForm').reset();
      loadAdminProducts();
    } else {
      alert('❌ Upload failed: ' + (data.error || 'Unknown error'));
    }
  } catch (err) {
    alert('❌ Network error: ' + err.message);
  }
});

async function loadAdminProducts() {
  const res = await fetch('/api/products', {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (res.status === 401) { logout(); return; }
  const products = await res.json();
  const list = document.getElementById('adminProductList');
  list.innerHTML = products.map(p => `
    <div class="product-item">
      <span>
        <strong>${p.name}</strong> - ${p.price}
        ${p.rating ? `⭐(${p.rating})` : ''}
        ${p.badge1 ? `<span class="badge-preview">${p.badge1}</span>` : ''}
        ${p.isFlashSale ? '🔥' : ''} ${p.isNewArrival ? '🆕' : ''}
      </span>
      <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
    </div>
  `).join('');
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await fetch(`/api/products/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${token}` }
  });
  loadAdminProducts();
}

// ============ AUTO-LOGIN CHECK ============
if (token) {
  // Verify token is still valid
  fetch('/api/auth/verify', {
    headers: { 'Authorization': `Bearer ${token}` }
  }).then(res => {
    if (res.ok) {
      showDashboard();
    } else {
      logout();
    }
  }).catch(() => {
    logout();
  });
} else {
  checkAdminExists();
}
</script>
</body>
</html>
