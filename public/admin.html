<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Leaflet CSS for admin map preview -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .admin-section { background: white; padding: 25px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .admin-section h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-row .full { grid-column: 1 / -1; }
    .admin-panel input, .admin-panel textarea, .admin-panel select { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #d1d5db; border-radius: 8px; }
    .admin-panel label { font-weight: 600; font-size: 0.9rem; color: #334155; }
    .checkbox-group { display: flex; gap: 20px; margin: 10px 0; }
    .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding: 12px 0; flex-wrap: wrap; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
    .badge-preview { background: #e2e8f0; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-right: 4px; }

    .gps-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .gps-btn:hover { background: #1d4ed8; }
    .gps-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #adminMapPreview { height: 200px; border-radius: 12px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .location-status { font-size: 0.9rem; color: #16a34a; margin-top: 4px; }
    .contact-icon-input { display: flex; align-items: center; gap: 10px; }
    .contact-icon-input i { font-size: 1.4rem; width: 30px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🔐 Admin Panel</h1>
  <a href="/">← Back to Shop</a>
  <a href="/seller-chat.html">💬 Live Chat</a>
  <a href="/seller-track.html">📍 Track Customers</a>
</div>

<!-- Login Form -->
<div class="login-box" id="loginBox">
  <h2>Seller Login</h2>
  <p style="color:#64748b;">Default: admin / password</p>
  <input type="text" id="adminUser" placeholder="Username" value="admin">
  <input type="password" id="adminPass" placeholder="Password" value="password">
  <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Login</button>
</div>

<!-- Admin Dashboard -->
<div id="dashboard" class="hidden container" style="max-width:900px;">

  <!-- SHOP PROFILE -->
  <div class="admin-panel admin-section">
    <h2>🏪 Shop Profile (Hero Section)</h2>
    <form id="shopForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="full">
          <label>Shop Name</label>
          <input type="text" id="shopName" name="name" placeholder="e.g. Kilimall Kenya">
        </div>
        <div class="full">
          <label>Location (City, Country)</label>
          <input type="text" id="shopLocation" name="location" placeholder="e.g. Nairobi, Kenya">
        </div>
        <div class="full">
          <label>Full Address (Street, Building)</label>
          <input type="text" id="shopAddress" name="address" placeholder="e.g. Moi Avenue, 2nd Floor">
        </div>
        <!-- GPS -->
        <div class="full">
          <label>📍 Shop GPS Coordinates</label>
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button type="button" class="gps-btn" id="getLocationBtn">📍 Get My Current Location</button>
            <span id="locationStatus" class="location-status"></span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">Latitude</label>
              <input type="text" id="shopLatitude" name="latitude" placeholder="Auto-filled" readonly style="background:#f1f5f9;">
            </div>
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">Longitude</label>
              <input type="text" id="shopLongitude" name="longitude" placeholder="Auto-filled" readonly style="background:#f1f5f9;">
            </div>
          </div>
          <div id="adminMapPreview"></div>
        </div>
        <!-- CONTACT DETAILS -->
        <div class="full">
          <label>📱 Contact Details (Social Media Messaging Links)</label>
          <p style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">
            Enter your profile usernames or links. Customers will be taken directly to your messaging inbox.
          </p>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">
                <i class="fab fa-whatsapp" style="color:#25D366;"></i> WhatsApp Number
              </label>
              <input type="text" id="shopWhatsapp" name="whatsapp" placeholder="e.g. 254712345678">
            </div>
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">
                <i class="fab fa-tiktok" style="color:#000;"></i> TikTok Username
              </label>
              <input type="text" id="shopTiktok" name="tiktok" placeholder="e.g. @myshop">
            </div>
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">
                <i class="fab fa-instagram" style="color:#E4405F;"></i> Instagram Username
              </label>
              <input type="text" id="shopInstagram" name="instagram" placeholder="e.g. @myshop">
            </div>
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">
                <i class="fab fa-facebook" style="color:#1877F2;"></i> Facebook Profile/Page
              </label>
              <input type="text" id="shopFacebook" name="facebook" placeholder="e.g. yourpage or username">
            </div>
            <div>
              <label style="font-weight:normal; font-size:0.8rem;">
                <i class="fas fa-phone" style="color:#2563eb;"></i> Phone Number
              </label>
              <input type="text" id="shopPhone" name="phone" placeholder="e.g. +254700000000">
            </div>
          </div>
        </div>
        <div class="full">
          <label>Short Description (What we do)</label>
          <textarea id="shopDesc" name="description" rows="2" placeholder="We sell quality electronics and home goods."></textarea>
        </div>
        <div>
          <label>Mission</label>
          <textarea id="shopMission" name="mission" rows="2" placeholder="To provide affordable products..."></textarea>
        </div>
        <div>
          <label>Vision</label>
          <textarea id="shopVision" name="vision" rows="2" placeholder="To become the top online store..."></textarea>
        </div>
        <div>
          <label>Shop Logo</label>
          <input type="file" id="shopLogo" name="logo" accept="image/*">
        </div>
        <div>
          <label>Hero Background Image</label>
          <input type="file" id="shopHero" name="heroImage" accept="image/*">
        </div>
      </div>
      <button type="submit" class="btn btn-success" style="width:100%;">💾 Update Shop Profile</button>
    </form>
  </div>

  <!-- ADD PRODUCT -->
  <div class="admin-panel admin-section">
    <h2>➕ Add New Product</h2>
    <form id="productForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="full">
          <label>Product Name</label>
          <input type="text" id="pName" name="name" placeholder="e.g. RichRipple M10 TWS" required>
        </div>
        <div>
          <label>Price</label>
          <input type="text" id="pPrice" name="price" placeholder="e.g. Ksh 409" required>
        </div>
        <div>
          <label>Rating / Reviews</label>
          <input type="text" id="pRating" name="rating" placeholder="e.g. 6235">
        </div>
        <div class="full">
          <label>Seller Contact</label>
          <input type="text" id="pContact" name="contact" placeholder="Phone / Email" value="+254700000000">
        </div>
        <div>
          <label>Badge 1 (e.g. Brand Official)</label>
          <input type="text" id="pBadge1" name="badge1" placeholder="Brand Official">
        </div>
        <div>
          <label>Badge 2 (e.g. Fulfilled By Kilimall)</label>
          <input type="text" id="pBadge2" name="badge2" placeholder="Fulfilled By Kilimall">
        </div>
        <div class="full">
          <label>Shipping Info</label>
          <input type="text" id="pShipping" name="shipping" placeholder="e.g. 1-3Day Fast Delivery In Kenya">
        </div>
        <div class="full checkbox-group">
          <label><input type="checkbox" id="pFlashSale" name="isFlashSale" value="true"> 🔥 Flash Sale</label>
          <label><input type="checkbox" id="pNewArrival" name="isNewArrival" value="true"> 🆕 New Arrival</label>
        </div>
        <div>
          <label>Upload Image</label>
          <input type="file" id="pImage" name="image" accept="image/*">
        </div>
        <div>
          <label>Upload Video (optional)</label>
          <input type="file" id="pVideo" name="video" accept="video/*">
        </div>
      </div>
      <button type="submit" class="btn btn-success" style="width:100%;margin-top:10px;">➕ Add Product</button>
    </form>
  </div>

  <!-- MANAGE PRODUCTS -->
  <div class="admin-panel admin-section">
    <h2>📋 Manage Products</h2>
    <div id="adminProductList"></div>
  </div>
</div>

<!-- Leaflet JS for admin map preview -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Font Awesome for icons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

<script>
// ---- LOGIN ----
function adminLogin() {
  const user = document.getElementById('adminUser').value;
  const pass = document.getElementById('adminPass').value;
  if (user === 'admin' && pass === 'password') {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadShopProfile();
    loadAdminProducts();
  } else {
    alert('❌ Wrong credentials! Use admin/password');
  }
}

// ---- SHOP PROFILE ----
let adminMap = null;

async function loadShopProfile() {
  const res = await fetch('/api/shop');
  const shop = await res.json();
  document.getElementById('shopName').value = shop.name || '';
  document.getElementById('shopLocation').value = shop.location || '';
  document.getElementById('shopAddress').value = shop.address || '';
  document.getElementById('shopLatitude').value = shop.latitude || '';
  document.getElementById('shopLongitude').value = shop.longitude || '';
  document.getElementById('shopWhatsapp').value = shop.whatsapp || '';
  document.getElementById('shopTiktok').value = shop.tiktok || '';
  document.getElementById('shopInstagram').value = shop.instagram || '';
  document.getElementById('shopFacebook').value = shop.facebook || '';
  document.getElementById('shopPhone').value = shop.phone || '';
  document.getElementById('shopDesc').value = shop.description || '';
  document.getElementById('shopMission').value = shop.mission || '';
  document.getElementById('shopVision').value = shop.vision || '';
  updateAdminMap(shop.latitude, shop.longitude);
}

function updateAdminMap(lat, lng) {
  const mapContainer = document.getElementById('adminMapPreview');
  const latNum = parseFloat(lat);
  const lngNum = parseFloat(lng);
  if (latNum && lngNum && !isNaN(latNum) && !isNaN(lngNum)) {
    if (adminMap) adminMap.remove();
    adminMap = L.map('adminMapPreview').setView([latNum, lngNum], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(adminMap);
    L.marker([latNum, lngNum]).addTo(adminMap);
  } else {
    mapContainer.innerHTML = '<p style="padding:10px;color:#94a3b8;text-align:center;">No location set. Click "Get My Current Location" to set.</p>';
    if (adminMap) { adminMap.remove(); adminMap = null; }
  }
}

document.getElementById('shopForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const logo = document.getElementById('shopLogo').files[0];
  const hero = document.getElementById('shopHero').files[0];
  if (logo) formData.append('logo', logo);
  if (hero) formData.append('heroImage', hero);
  try {
    const res = await fetch('/api/shop', { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      alert('✅ Shop Profile Updated!');
      loadShopProfile();
    } else {
      alert('❌ Update failed: ' + (data.error || 'Unknown error'));
    }
  } catch(err) {
    alert('❌ Network error: ' + err.message);
  }
});

// ---- GPS ----
document.getElementById('getLocationBtn').addEventListener('click', function() {
  const btn = this;
  const status = document.getElementById('locationStatus');
  if (!navigator.geolocation) {
    status.textContent = '❌ Geolocation not supported.';
    return;
  }
  btn.disabled = true;
  status.textContent = '⏳ Getting your location...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      document.getElementById('shopLatitude').value = lat;
      document.getElementById('shopLongitude').value = lng;
      status.textContent = '✅ Location detected!';
      status.style.color = '#16a34a';
      updateAdminMap(lat, lng);
      btn.disabled = false;
    },
    (err) => {
      status.textContent = '❌ Error: ' + err.message;
      status.style.color = '#ef4444';
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
});

// ---- PRODUCTS ----
document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const flashSale = document.getElementById('pFlashSale').checked;
  const newArrival = document.getElementById('pNewArrival').checked;
  formData.set('isFlashSale', flashSale ? 'true' : 'false');
  formData.set('isNewArrival', newArrival ? 'true' : 'false');
  const imageFile = document.getElementById('pImage').files[0];
  const videoFile = document.getElementById('pVideo').files[0];
  if (imageFile) formData.append('image', imageFile);
  if (videoFile) formData.append('video', videoFile);
  try {
    const res = await fetch('/api/products', { method: 'POST', body: formData });
    let data;
    const contentType = res.headers.get('content-type');
    if (contentType && contentType.includes('application/json')) {
      data = await res.json();
    } else {
      const text = await res.text();
      alert('❌ Server returned non-JSON response:\n' + text.substring(0, 200));
      return;
    }
    if (res.ok) {
      alert('✅ Product added!');
      document.getElementById('productForm').reset();
      loadAdminProducts();
    } else {
      alert('❌ Upload failed: ' + (data.error || 'Unknown error'));
    }
  } catch(err) {
    alert('❌ Network error: ' + err.message);
  }
});

async function loadAdminProducts() {
  const res = await fetch('/api/products');
  const products = await res.json();
  const list = document.getElementById('adminProductList');
  list.innerHTML = products.map(p => `
    <div class="product-item">
      <span>
        <strong>${p.name}</strong> - ${p.price} 
        ${p.rating ? `⭐(${p.rating})` : ''}
        ${p.badge1 ? `<span class="badge-preview">${p.badge1}</span>` : ''}
        ${p.isFlashSale ? '🔥' : ''} ${p.isNewArrival ? '🆕' : ''}
      </span>
      <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
    </div>
  `).join('');
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await fetch(`/api/products/${id}`, { method: 'DELETE' });
  loadAdminProducts();
}
</script>
</body>
</html>
