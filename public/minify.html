<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Minifier</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', -apple-system, sans-serif; 
      background: #f1f5f9; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      margin: 20px;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 i { color: #2563eb; }
    .sub {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(37,99,235,0.2);
    }
    .btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 12px rgba(34,197,94,0.2);
    }
    .btn-success:hover {
      box-shadow: 0 6px 20px rgba(34,197,94,0.3);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 12px rgba(239,68,68,0.2);
    }
    .btn-danger:hover {
      box-shadow: 0 6px 20px rgba(239,68,68,0.3);
    }
    .output {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      min-height: 60px;
      display: none;
    }
    .output.show { display: block; }
    .output.success { border-color: #22c55e; background: #f0fdf4; }
    .output.error { border-color: #ef4444; background: #fef2f2; }
    .output .icon { font-size: 1.2rem; margin-right: 8px; }
    .output .title { font-weight: 700; font-size: 0.95rem; }
    .output .details { 
      margin-top: 8px; 
      font-size: 0.85rem;
      color: #475569;
    }
    .output .details .file {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f1f4f8;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .stat {
      background: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .stat .number {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
    }
    .stat .label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-compress-arrows-alt"></i> Asset Minifier</h1>
    <p class="sub">Minify JavaScript and CSS files to improve performance.</p>
    
    <div class="stats" id="stats">
      <div class="stat">
        <div class="number" id="jsCount">0</div>
        <div class="label">JS Files</div>
      </div>
      <div class="stat">
        <div class="number" id="cssCount">0</div>
        <div class="label">CSS Files</div>
      </div>
      <div class="stat">
        <div class="number" id="totalSize">0 KB</div>
        <div class="label">Total Size</div>
      </div>
    </div>
    
    <div class="btn-group">
      <button class="btn" id="minifyBtn" onclick="minifyAssets()">
        <i class="fas fa-compress"></i> Minify Assets
      </button>
      <button class="btn btn-success" onclick="window.location.reload()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
      <a href="/admin.html" class="btn btn-danger" style="text-decoration:none;">
        <i class="fas fa-arrow-left"></i> Back to Admin
      </a>
    </div>
    
    <div class="output" id="output"></div>
  </div>
  
  <script>
    // Load initial stats
    async function loadStats() {
      try {
        const response = await fetch('/api/admin/assets/stats', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('jsCount').textContent = data.jsCount;
          document.getElementById('cssCount').textContent = data.cssCount;
          document.getElementById('totalSize').textContent = data.totalSize;
        }
      } catch (err) {
        console.error('Stats error:', err);
      }
    }
    
    async function minifyAssets() {
      const btn = document.getElementById('minifyBtn');
      const output = document.getElementById('output');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Minifying...';
      
      output.className = 'output show';
      output.innerHTML = `
        <div class="icon">⏳</div>
        <div class="title">Minifying assets...</div>
        <div class="details">Please wait, this may take a moment.</div>
      `;
      
      try {
        const response = await fetch('/api/admin/minify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        });
        
        const data = await response.json();
        
        if (data.success) {
          let filesHtml = data.files.map(f => `
            <div class="file">
              <span>${f}</span>
              <span style="color:#16a34a;">✅</span>
            </div>
          `).join('');
          
          output.className = 'output show success';
          output.innerHTML = `
            <div class="icon">✅</div>
            <div class="title">${data.message}</div>
            <div class="details">
              <p><strong>Files Minified:</strong> ${data.files.length}</p>
              <p><strong>Total Reduction:</strong> ${data.totalReduction}</p>
              <div style="margin-top:8px;"><strong>Files:</strong></div>
              ${filesHtml}
            </div>
          `;
          loadStats();
        } else {
          output.className = 'output show error';
          output.innerHTML = `
            <div class="icon">❌</div>
            <div class="title">Failed to minify assets</div>
            <div class="details">${data.error || 'Unknown error'}</div>
          `;
        }
      } catch (err) {
        output.className = 'output show error';
        output.innerHTML = `
          <div class="icon">❌</div>
          <div class="title">Network Error</div>
          <div class="details">${err.message}</div>
        `;
      }
      
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-compress"></i> Minify Assets';
    }
    
    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
