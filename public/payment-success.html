<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .payment-success {
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
      padding: 40px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .payment-success .icon {
      font-size: 4rem;
      color: #22c55e;
      margin-bottom: 16px;
    }
    .payment-success h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
    }
    .payment-success p {
      color: #64748b;
      margin: 8px 0 20px;
    }
    .payment-success .btn {
      padding: 12px 32px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .payment-success .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="payment-success">
    <div class="icon"><i class="fas fa-check-circle"></i></div>
    <h1>✅ Payment Successful!</h1>
    <p>Your PayPal payment has been confirmed. We'll send you an email with the order details.</p>
    <a href="/account.html" class="btn">View My Orders</a>
    <br><br>
    <a href="/" style="color: #64748b; text-decoration: none;">Continue Shopping</a>
  </div>

  <script>
    // Parse URL parameters for order ID
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || urlParams.get('PayerID') || null;
    const token = localStorage.getItem('customerToken');
    
    if (orderId && token) {
      // Capture the payment
      const paypalOrderId = urlParams.get('token') || urlParams.get('paymentId');
      if (paypalOrderId) {
        fetch('/api/payments/paypal/capture', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            orderId: orderId,
            paypalOrderId: paypalOrderId
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            console.log('✅ Payment captured successfully');
          } else {
            console.error('❌ Payment capture failed:', data.message);
          }
        })
        .catch(err => console.error('❌ Capture error:', err));
      }
    }
  </script>
</body>
</html>
