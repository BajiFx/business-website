<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .reset-page {
      max-width: 400px;
      margin: 40px auto;
      padding: 0 12px;
    }
    .reset-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid #eef2f6;
    }
    .reset-card h1 {
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4px;
    }
    .reset-card .sub {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }
    .reset-card .form-group {
      margin-bottom: 14px;
    }
    .reset-card .form-group label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #334155;
      display: block;
      margin-bottom: 4px;
    }
    .reset-card .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    .reset-card .form-group input:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }
    .reset-card .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reset-card .btn:hover {
      background: #1d4ed8;
    }
    .reset-card .btn-success {
      background: #22c55e;
    }
    .reset-card .btn-success:hover {
      background: #16a34a;
    }
    .reset-card .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .reset-card .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }
    .reset-card .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    .reset-card .back-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .reset-card .back-link:hover {
      color: #2563eb;
    }
    .header {
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header h1 {
      font-weight: 800;
      font-size: 1.1rem;
      color: white;
    }
    .header h1 i { color: #facc15; margin-right: 8px; }
    .header a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: color 0.3s;
    }
    .header a:hover {
      color: white;
    }
  </style>
</head>
<body>

<div class="header">
  <h1><i class="fas fa-store"></i> <span id="shopNameHeader">Our Business</span></h1>
  <a href="/"><i class="fas fa-home"></i> Home</a>
</div>

<div class="reset-page">
  <div class="reset-card">
    <h1>🔑 Reset Password</h1>
    <p class="sub" id="pageSub">Enter your email to receive a reset link.</p>

    <div id="step1">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="your@email.com">
      </div>
      <button class="btn" onclick="requestReset()">Send Reset Link</button>
    </div>

    <div id="step2" style="display:none;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password">
      </div>
      <button class="btn btn-success" onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="status" class="status"></div>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Shop</a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (token) {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('pageSub').textContent = 'Enter your new password.';
  }

  async function requestReset() {
    const email = document.getElementById('resetEmail').value.trim();
    const status = document.getElementById('status');
    if (!email) {
      status.className = 'status error';
      status.textContent = '❌ Please enter your email address.';
      return;
    }

    status.className = 'status';
    status.textContent = '⏳ Sending reset link...';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        status.className = 'status success';
        status.textContent = '✅ If your email is registered, you will receive a reset link.';
        document.getElementById('resetEmail').value = '';
      } else {
        status.className = 'status error';
        status.textContent = '❌ ' + (data.error || 'Something went wrong.');
      }
    } catch (err) {
      status.className = 'status error';
      status.textContent = '❌ Network error. Please try again.';
    }
  }

  async function resetPassword() {
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const status = document.getElementById('status');

    if (!password || password.length < 6) {
      status.className = 'status error';
      status.textContent = '❌ Password must be at least 6 characters.';
      return;
    }
    if (password !== confirm) {
      status.className = 'status error';
      status.textContent = '❌ Passwords do not match.';
      return;
    }

    status.className = 'status';
    status.textContent = '⏳ Resetting password...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if (data.success) {
        status.className = 'status success';
        status.textContent = '✅ ' + data.message + ' Redirecting...';
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } else {
        status.className = 'status error';
        status.textContent = '❌ ' + (data.error || 'Reset failed.');
      }
    } catch (err) {
      status.className = 'status error';
      status.textContent = '❌ Network error. Please try again.';
    }
  }
</script>
</body>
</html>
