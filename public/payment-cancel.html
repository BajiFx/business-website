<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .payment-cancel {
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
      padding: 40px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .payment-cancel .icon {
      font-size: 4rem;
      color: #ef4444;
      margin-bottom: 16px;
    }
    .payment-cancel h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
    }
    .payment-cancel p {
      color: #64748b;
      margin: 8px 0 20px;
    }
    .payment-cancel .btn {
      padding: 12px 32px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .payment-cancel .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="payment-cancel">
    <div class="icon"><i class="fas fa-times-circle"></i></div>
    <h1>❌ Payment Cancelled</h1>
    <p>You cancelled the PayPal payment. You can try again or choose another payment method.</p>
    <a href="/cart.html" class="btn">Back to Cart</a>
    <br><br>
    <a href="/" style="color: #64748b; text-decoration: none;">Continue Shopping</a>
  </div>
</body>
</html>
